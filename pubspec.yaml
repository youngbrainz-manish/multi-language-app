name: multi_language_app
description: This application helps you to easily implement the multi language to your flutter application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localization: ^0.3.3
  shared_preferences: ^2.2.2
  provider: ^6.1.5
  introduction_screen: ^3.1.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/
